name: Browser layout QA
on:
  pull_request:
  push:
    branches:
      - redesign/bc-public-data-20261108
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser testing dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and smartphone layouts
        run: node tests/browser-qa.mjs
      - name: Store QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesigned-site-screenshots
          path: qa-screenshots/
